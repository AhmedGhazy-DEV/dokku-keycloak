name: Bug report
description: Something in the plugin does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets (passwords, tokens, client secrets) from any output you paste.
        Security issues go to hello@shebanglabs.io instead, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. dokku keycloak:create auth
        2. dokku keycloak:...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: >-
        Paste the output of the failing command. Do not paste `dokku --trace`
        output unless asked: it prints configuration values, including the
        admin and database passwords.
      render: shell
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "`dokku plugin:list | grep keycloak`"
    validations:
      required: true
  - type: input
    id: dokku-version
    attributes:
      label: Dokku version
      description: "`dokku version`"
    validations:
      required: true
  - type: input
    id: keycloak-version
    attributes:
      label: Keycloak version
      description: "`dokku keycloak:info <name>`"
  - type: input
    id: os
    attributes:
      label: Host OS
      placeholder: Ubuntu 24.04
