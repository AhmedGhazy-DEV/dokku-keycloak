name: Feature request
description: Suggest a new command or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and why the current commands make it hard.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the command or behaviour could look, for example `dokku keycloak:... <name>`.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
